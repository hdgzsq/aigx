# Cloudflare Workers 配置
name = "ai-rewrite-tool"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 部署配置
workers_dev = true

# 环境变量（部署时在 wrangler.toml 或 CF 控制台设置）
# [vars]
# AGNES_BASE_URL = "https://apihub.agnes-ai.com/v1"
# AGNES_MODEL = "agnes-2.0-flash"

# 绑定 secrets（API Key 不提交到仓库）
# [[unsafe.bindings]]
# name = "AGNES_API_KEY"
# type = "secret_text"

[[routes]]
pattern = "rewrite-tool.huang.me/*"
zone_name = "huang.me"

[observability]
enabled = true
